# BLE
CONFIG_BT=y
CONFIG_BT_BAS=y
CONFIG_ZMK_BLE=y
# USB serial — lets the configure tab detect which keys are plugged in
CONFIG_ZMK_USB=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SERIAL=y

# I2C
CONFIG_I2C=y

# PCA9557 GPIO expander (custom driver in config/drivers/gpio/)
CONFIG_GPIO_PCA9557=y

# Polling kscan (GPIO expanders don't support interrupts)
CONFIG_ZMK_KSCAN_DIRECT_POLLING=y

# Battery reporting over BLE (nice!nano has onboard fuel gauge)
CONFIG_ZMK_BATTERY_REPORTING=y

# Debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
