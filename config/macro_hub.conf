# BLE
CONFIG_BT=y
CONFIG_BT_BAS=y
CONFIG_ZMK_BLE=y

# I2C
CONFIG_I2C=y

# GPIO expander (PCA9557 uses the PCA9538 driver in Zephyr)
CONFIG_GPIO_PCA_SERIES=y

# I2C mux (TCA9548A)
CONFIG_I2C_MUX=y
CONFIG_I2C_MUX_TCA954X=y

# Polling kscan (no interrupts needed — GPIO expanders handle that)
CONFIG_ZMK_KSCAN_DIRECT_POLLING=y

# Battery reporting over BLE (nice!nano has onboard fuel gauge)
CONFIG_ZMK_BATTERY_REPORTING=y

# Debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
